<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<title>Admin · Seller Bot</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23f5b82e'/%3E%3Cpath d='M16 7a6 6 0 0 0-6 6v4l-2 3v1h16v-1l-2-3v-4a6 6 0 0 0-6-6zm-2.5 15a2.5 2.5 0 0 0 5 0z' fill='%23161309'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<script>try { const t = localStorage.getItem('eldo.theme'); if (t) document.documentElement.dataset.theme = t; } catch {}</script>
<style>
  :root, [data-theme="dark"] {
    --bg: #0a0b0f; --bg-glow: rgba(245,184,46,.07);
    --surface: #111318; --surface-2: #161920; --surface-3: #1c2029; --input: #0c0e12;
    --line: #23272f; --line-2: #2d323c;
    --text: #eceef2; --text-2: #b4bac6; --muted: #858c9a; --faint: #5a616e;
    --gold: #f5b82e; --gold-2: #ffd36b; --on-gold: #1a1405; --gold-soft: rgba(245,184,46,.12);
    --green: #34d399; --green-soft: rgba(52,211,153,.13);
    --red: #f87171; --red-soft: rgba(248,113,113,.13);
    --amber: #fbbf24; --amber-soft: rgba(251,191,36,.13);
    --blue: #60a5fa; --blue-soft: rgba(96,165,250,.13);
    --shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 8px 24px -12px rgba(0,0,0,.6);
  }
  [data-theme="light"] {
    --bg: #f5f6f8; --bg-glow: rgba(245,184,46,.10);
    --surface: #ffffff; --surface-2: #f9fafb; --surface-3: #f1f3f6; --input: #ffffff;
    --line: #e4e7ec; --line-2: #d5dae1;
    --text: #12151b; --text-2: #3d4452; --muted: #69717f; --faint: #9aa1ad;
    --gold: #d99a0b; --gold-2: #f5b82e; --on-gold: #1a1405; --gold-soft: rgba(217,154,11,.12);
    --green: #059669; --green-soft: rgba(5,150,105,.10);
    --red: #dc2626; --red-soft: rgba(220,38,38,.09);
    --amber: #b45309; --amber-soft: rgba(180,83,9,.10);
    --blue: #2563eb; --blue-soft: rgba(37,99,235,.09);
    --shadow: 0 1px 2px rgba(16,24,40,.05), 0 8px 24px -16px rgba(16,24,40,.18);
  }
  :root { --r: 12px; --mono: ui-monospace, "Cascadia Mono", "SF Mono", Consolas, monospace; }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body { background: radial-gradient(1100px 520px at 0% -10%, var(--bg-glow), transparent 60%), var(--bg); color: var(--text); min-height: 100vh; font: 14px/1.5 Inter, "Segoe UI Variable", "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  button, input, select, textarea { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .num { font-variant-numeric: tabular-nums; }
  svg.i { width: 16px; height: 16px; flex: none; }
  .grow { flex: 1; }

  .topbar { position: sticky; top: 0; z-index: 20; backdrop-filter: saturate(1.4) blur(14px); background: color-mix(in srgb, var(--bg) 82%, transparent); border-bottom: 1px solid var(--line); }
  .topbar .in { max-width: 1240px; margin: 0 auto; padding: 12px 20px; display: flex; align-items: center; gap: 8px; }
  .brand { display: flex; align-items: center; gap: 10px; }
  .logo { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: linear-gradient(140deg, var(--gold-2), var(--gold)); color: #161309; box-shadow: 0 6px 18px -6px rgba(245,184,46,.55); }
  .brand h1 { margin: 0; font-size: 15px; font-weight: 650; }
  .brand .sub { font-size: 12px; color: var(--muted); }
  .nav { display: flex; align-items: center; gap: 6px; }
  .navlink { display: inline-flex; align-items: center; gap: 6px; height: 34px; padding: 0 12px; border-radius: 9px; color: var(--text-2); text-decoration: none; font-weight: 600; font-size: 13px; border: 1px solid transparent; background: none; cursor: pointer; }
  .navlink:hover { background: var(--surface-2); color: var(--text); }
  .iconbtn { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); display: grid; place-items: center; cursor: pointer; }
  .iconbtn:hover { color: var(--text); border-color: var(--line-2); }

  .wrap { max-width: 1240px; margin: 0 auto; padding: 20px 20px 96px; }
  .kpis { display: grid; grid-template-columns: repeat(6, 1fr); gap: 12px; }
  .kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px 16px; box-shadow: var(--shadow); }
  .kpi .k { color: var(--muted); font-size: 12px; font-weight: 500; display: flex; align-items: center; gap: 6px; }
  .kpi .v { font-size: 22px; font-weight: 650; letter-spacing: -.02em; margin-top: 4px; line-height: 1.2; }
  .kpi .v small { font-size: 13px; color: var(--muted); font-weight: 500; }
  .kpi.warn .v { color: var(--amber); } .kpi.bad .v { color: var(--red); }

  .toolbar { display: flex; align-items: center; gap: 10px; margin: 22px 0 12px; flex-wrap: wrap; }
  .search { flex: 1; min-width: 200px; position: relative; }
  .search svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--faint); }
  .search input { width: 100%; height: 38px; padding: 0 12px 0 34px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; outline: none; }
  .search input:focus { border-color: color-mix(in srgb, var(--gold) 60%, transparent); box-shadow: 0 0 0 3px var(--gold-soft); }
  .chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; margin-bottom: 12px; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 11px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--text-2); font-size: 12.5px; font-weight: 500; cursor: pointer; }
  .chip:hover { border-color: var(--line-2); color: var(--text); }
  .chip[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
  .chip .n { font-size: 11px; opacity: .7; }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 36px; padding: 0 14px; border-radius: 9px; border: 1px solid var(--line-2); background: var(--surface-3); color: var(--text); font-weight: 600; font-size: 13px; cursor: pointer; white-space: nowrap; transition: .15s; text-decoration: none; }
  .btn:hover { border-color: var(--faint); }
  .btn:disabled { opacity: .5; cursor: not-allowed; }
  .btn.gold { background: linear-gradient(140deg, var(--gold-2), var(--gold)); color: var(--on-gold); border-color: transparent; }
  .btn.gold:hover { filter: brightness(1.05); }
  .btn.red { color: var(--red); border-color: color-mix(in srgb, var(--red) 40%, transparent); background: var(--red-soft); }
  .btn.green { color: var(--green); border-color: color-mix(in srgb, var(--green) 40%, transparent); background: var(--green-soft); }
  .btn.sm { height: 30px; padding: 0 10px; font-size: 12.5px; border-radius: 8px; }
  .btn.ghost { background: transparent; border-color: transparent; color: var(--text-2); }
  .btn.ghost:hover { background: var(--surface-3); color: var(--text); }
  .btn.icon { width: 30px; padding: 0; }

  /* table */
  .table { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); box-shadow: var(--shadow); overflow: hidden; }
  .thead, .row { display: grid; grid-template-columns: minmax(200px, 1.6fr) 130px minmax(150px, 1fr) 120px minmax(250px, auto); gap: 12px; align-items: center; padding: 0 16px; }
  .thead { height: 40px; color: var(--muted); font-size: 12px; font-weight: 600; border-bottom: 1px solid var(--line); background: var(--surface-2); }
  .row { min-height: 66px; border-bottom: 1px solid var(--line); cursor: pointer; transition: background .15s; }
  .row:last-child { border-bottom: 0; }
  .row:hover { background: var(--surface-2); }
  .row.off .who, .row.off .paid, .row.off .off2 { opacity: .55; }
  .who { display: flex; align-items: center; gap: 11px; min-width: 0; }
  .av { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; font-weight: 700; font-size: 13px; flex: none; background: var(--surface-3); color: var(--text-2); }
  .av.admin { background: var(--gold-soft); color: var(--gold); }
  .nm { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; gap: 6px; align-items: center; }
  .un { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .status { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 9px; border-radius: 999px; font-size: 12px; font-weight: 600; white-space: nowrap; }
  .status::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
  .s-run { background: var(--green-soft); color: var(--green); }
  .s-start { background: var(--blue-soft); color: var(--blue); }
  .s-err { background: var(--red-soft); color: var(--red); }
  .s-off { background: var(--surface-3); color: var(--muted); }
  .s-exp { background: var(--amber-soft); color: var(--amber); }
  .tagx { font-size: 10.5px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; padding: 1px 6px; border-radius: 5px; background: var(--gold-soft); color: var(--gold); }
  .paid .d { font-weight: 600; } .paid .l { font-size: 12.5px; color: var(--muted); }
  .paid .l.warn { color: var(--amber); font-weight: 600; } .paid .l.bad { color: var(--red); font-weight: 600; }
  .offs b { font-size: 16px; } .offs .f { color: var(--red); font-size: 12px; font-weight: 600; margin-left: 4px; }
  .acts { display: flex; gap: 6px; justify-content: flex-end; align-items: center; }
  .err-line { font-size: 12px; color: var(--red); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .empty { text-align: center; color: var(--muted); padding: 48px 16px; }
  .empty .big { width: 44px; height: 44px; margin: 0 auto 12px; border-radius: 12px; display: grid; place-items: center; background: var(--surface-3); color: var(--gold); }
  .skel { height: 66px; border-bottom: 1px solid var(--line); background: linear-gradient(90deg, transparent, var(--surface-2), transparent); background-size: 200% 100%; animation: sk 1.2s infinite; }
  @keyframes sk { from { background-position: 200% 0; } to { background-position: -200% 0; } }

  /* menu */
  .menu { position: fixed; z-index: 70; min-width: 210px; background: var(--surface); border: 1px solid var(--line-2); border-radius: 12px; padding: 6px; box-shadow: 0 20px 50px -18px rgba(0,0,0,.7); display: none; }
  .menu button { display: flex; align-items: center; gap: 9px; width: 100%; height: 36px; padding: 0 10px; border: 0; border-radius: 8px; background: none; text-align: left; cursor: pointer; color: var(--text-2); font-size: 13px; }
  .menu button:hover, .menu button:focus-visible { background: var(--surface-3); color: var(--text); outline: none; }
  .menu button.danger { color: var(--red); }
  .menu hr { border: 0; border-top: 1px solid var(--line); margin: 6px 4px; }

  /* drawer */
  .scrim { position: fixed; inset: 0; z-index: 80; background: rgba(5,6,9,.55); backdrop-filter: blur(2px); display: none; }
  .drawer { position: fixed; top: 0; right: 0; bottom: 0; z-index: 90; width: min(520px, 100vw); background: var(--surface); border-left: 1px solid var(--line); box-shadow: -30px 0 60px -30px rgba(0,0,0,.7); display: flex; flex-direction: column; transform: translateX(100%); transition: transform .25s cubic-bezier(.2,.8,.2,1); }
  .drawer.open { transform: none; }
  .dh { display: flex; align-items: center; gap: 12px; padding: 16px 18px; border-bottom: 1px solid var(--line); }
  .dh h2 { margin: 0; font-size: 16px; }
  .dh .un { margin-top: 1px; }
  .tabs { display: flex; gap: 2px; padding: 0 12px; border-bottom: 1px solid var(--line); overflow-x: auto; scrollbar-width: none; }
  .tabs button { flex: none; height: 42px; padding: 0 12px; border: 0; background: none; color: var(--muted); font-weight: 600; font-size: 13px; cursor: pointer; border-bottom: 2px solid transparent; }
  .tabs button[aria-selected="true"] { color: var(--text); border-bottom-color: var(--gold); }
  .db { flex: 1; overflow: auto; padding: 18px; }
  .df { padding: 14px 18px; border-top: 1px solid var(--line); display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; }
  .kv { display: grid; grid-template-columns: 140px 1fr; gap: 10px 14px; font-size: 13.5px; }
  .kv dt { color: var(--muted); } .kv dd { margin: 0; word-break: break-word; }
  .box { background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .box + .box { margin-top: 12px; }
  .box.red { border-color: color-mix(in srgb, var(--red) 35%, transparent); background: var(--red-soft); }
  .box h4 { margin: 0 0 4px; font-size: 13.5px; } .box p { margin: 0 0 10px; color: var(--text-2); font-size: 13px; }
  .cred { font: 13px/1.7 var(--mono); white-space: pre-wrap; word-break: break-all; background: var(--input); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin: 10px 0; }
  .f { display: flex; flex-direction: column; gap: 5px; margin-bottom: 12px; }
  .f > span { color: var(--muted); font-size: 12px; font-weight: 500; }
  .f input, .f select, .f textarea { width: 100%; background: var(--input); border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; outline: none; }
  .f input:focus, .f textarea:focus, .f select:focus { border-color: color-mix(in srgb, var(--gold) 60%, transparent); box-shadow: 0 0 0 3px var(--gold-soft); }
  .f small { color: var(--faint); font-size: 12px; }
  .two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .quick { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .formerr { color: var(--red); font-size: 13px; min-height: 18px; margin-top: 4px; }
  pre.log { margin: 0; background: var(--input); border: 1px solid var(--line); border-radius: 10px; padding: 12px; font: 11.5px/1.55 var(--mono); color: var(--text-2); white-space: pre-wrap; word-break: break-word; min-height: 300px; max-height: calc(100vh - 260px); overflow: auto; }

  dialog { border: 1px solid var(--line); background: var(--surface); color: var(--text); border-radius: 14px; padding: 0; width: min(440px, calc(100vw - 32px)); box-shadow: 0 24px 60px -20px rgba(0,0,0,.7); }
  dialog::backdrop { background: rgba(5,6,9,.6); backdrop-filter: blur(2px); }
  .dlg { padding: 20px; } .dlg h3 { margin: 0 0 6px; font-size: 16px; } .dlg p { margin: 0; color: var(--text-2); font-size: 13.5px; white-space: pre-line; }
  .dlg .actsrow { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }
  .toasts { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); z-index: 100; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
  .toast { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 10px; background: var(--surface-3); border: 1px solid var(--line-2); font-size: 13px; font-weight: 600; box-shadow: 0 12px 30px -12px rgba(0,0,0,.6); }
  .toast.ok svg { color: var(--green); } .toast.bad svg { color: var(--red); }

  @media (max-width: 1100px) { .kpis { grid-template-columns: repeat(3, 1fr); } }
  @media (max-width: 860px) {
    .thead { display: none; }
    .row { grid-template-columns: 1fr auto; grid-template-areas: "who st" "paid offs" "acts acts"; gap: 8px 12px; padding: 14px 16px; }
    .row > .who { grid-area: who; } .row > .st { grid-area: st; justify-self: end; } .row > .paid { grid-area: paid; }
    .row > .offs { grid-area: offs; justify-self: end; text-align: right; } .row > .acts { grid-area: acts; justify-content: flex-start; flex-wrap: wrap; }
  }
  @media (max-width: 640px) {
    .topbar .in, .wrap { padding-left: 14px; padding-right: 14px; }
    .brand .sub, .navlink .lbl { display: none; }
    .kpis { grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .kpi { padding: 12px; } .kpi .v { font-size: 19px; }
    .two { grid-template-columns: 1fr; }
    .kv { grid-template-columns: 110px 1fr; }
  }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header class="topbar">
  <div class="in">
    <div class="brand"><div class="logo" data-i="crown"></div><div><h1>Admin Panel</h1><div class="sub">Customers, bots &amp; logins</div></div></div>
    <div class="grow"></div>
    <nav class="nav">
      <a class="navlink" href="/" id="myBotLink" data-i="external"><span class="lbl">My bot</span></a>
      <button class="navlink" id="myAccountBtn" data-i="user"><span class="lbl">My account</span></button>
      <button class="iconbtn" id="themeBtn" aria-label="Switch light / dark" title="Switch light / dark"></button>
      <a class="navlink" href="/logout" data-i="logout"><span class="lbl">Log out</span></a>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="kpis" aria-label="Overview">
    <div class="kpi"><div class="k" data-i="users">Customers</div><div class="v num" id="kCustomers">–</div></div>
    <div class="kpi"><div class="k" data-i="bot">Bots running</div><div class="v num" id="kRunning">–</div></div>
    <div class="kpi"><div class="k" data-i="send">Offers today</div><div class="v num" id="kOffers">–</div></div>
    <div class="kpi" id="kExpWrap"><div class="k" data-i="calendar">Expiring ≤ 3 days</div><div class="v num" id="kExpiring">–</div></div>
    <div class="kpi" id="kMemWrap"><div class="k" data-i="cpu">VPS memory</div><div class="v num" id="kMem">–</div></div>
    <div class="kpi"><div class="k" data-i="save">Last backup</div><div class="v num" id="kBackup" style="font-size:16px">–</div></div>
  </section>

  <div class="toolbar">
    <button class="btn gold" id="addBtn" data-i="plus">Add customer</button>
    <label class="search"><span data-i="search" style="display:contents"></span><input id="search" placeholder="Search name or username…" aria-label="Search customers"></label>
  </div>
  <div class="chips" id="chips" role="toolbar" aria-label="Filter"></div>

  <section class="table" aria-label="Accounts">
    <div class="thead"><div>Customer</div><div>Status</div><div>Paid until</div><div>Offers today</div><div style="text-align:right">Actions</div></div>
    <div id="rows"><div class="skel"></div><div class="skel"></div><div class="skel"></div></div>
  </section>
</main>

<div class="menu" id="menu" role="menu"></div>
<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="dTitle">
  <div class="dh"><div class="av" id="dAv"></div><div style="flex:1;min-width:0"><h2 id="dTitle"></h2><div class="un" id="dSub"></div></div><button class="iconbtn" id="dClose" aria-label="Close" data-i="x"></button></div>
  <div class="tabs" id="dTabs" role="tablist"></div>
  <div class="db" id="dBody"></div>
  <div class="df" id="dFoot"></div>
</aside>

<dialog id="confirmDlg"><form method="dialog" class="dlg">
  <h3 id="cdTitle"></h3><p id="cdText"></p>
  <div class="actsrow"><button class="btn" value="no">Cancel</button><button class="btn gold" value="yes" id="cdYes">OK</button></div>
</form></dialog>

<div class="toasts" id="toasts" aria-live="polite"></div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const ICONS = {
    crown: '<path d="m2 4 3 12h14l3-12-6 7-4-7-4 7-6-7z"/><path d="M5 20h14"/>',
    external: '<path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>',
    user: '<circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/>',
    logout: '<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>',
    users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/>',
    bot: '<rect x="3" y="8" width="18" height="12" rx="3"/><path d="M12 4v4M8 14h.01M16 14h.01"/>',
    send: '<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',
    calendar: '<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',
    cpu: '<rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 14h3M1 9h3M1 14h3"/>',
    save: '<path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><path d="M17 21v-8H7v8M7 3v5h8"/>',

  function tabKeys(a, body, foot) {
    const intro = el('div', 'box');
    intro.append(el('h4', null, a.keyHint ? `Current key ••••${a.keyHint}` : 'No API keys yet'), el('p', null, 'Paste the Eldorado Client ID and Client Secret (Eldorado → Seller API). They are checked with Eldorado before saving and stored encrypted. The bot restarts with the new keys.'));
    body.append(intro);
    const form = el('form'); form.style.marginTop = '14px';
    form.innerHTML = `<label class="f"><span>Client ID</span><input name="clientId" required autocomplete="off" spellcheck="false"></label>
      <label class="f"><span>Client Secret</span><input name="clientSecret" type="password" required autocomplete="new-password" spellcheck="false"></label><div class="formerr"></div>`;
    body.append(form); watchDirty(form);
    const save = ibtn('key', 'Check & save keys', 'gold', () => form.requestSubmit());
    foot.append(save);
    form.onsubmit = async (e) => {
      e.preventDefault();
      const err = form.querySelector('.formerr'); err.textContent = 'Checking with Eldorado…'; save.disabled = true;
      const payload = { clientId: form.clientId.value, clientSecret: form.clientSecret.value };
      let r = await api(`accounts/${a.username}/keys`, payload);
      if (!r.ok && r.duplicateOf && (await confirmDuplicate(r.duplicateOf))) r = await api(`accounts/${a.username}/keys`, { ...payload, allowDuplicateKeys: true });
      save.disabled = false;
      if (!r.ok) { err.textContent = r.error || 'Failed'; return; }
      drawerState.dirty = false; toast('Keys saved - bot restarting'); await refresh(); drawerState.tab = 'overview'; renderTab();
    };
  }

  async function tabLog(a, body, foot) {
    const pre = el('pre', 'log', 'Loading…'); body.append(pre);
    const load = async () => {
      const r = await api(`accounts/${a.username}/log`);
      pre.textContent = r.ok ? (r.lines.join('\n').trim() || '(empty)') : (r.error || 'Failed');
      pre.scrollTop = pre.scrollHeight;
    };
    foot.append(ibtn('refresh', 'Refresh', '', load));
    load();
  }

  function tabEdit(a, body, foot) {
    const form = el('form');
    form.innerHTML = `<label class="f"><span>Name</span><input name="custName" required maxlength="60"></label>
      ${a.role === 'customer' ? `<label class="f"><span>Paid until</span><input name="paidUntil" type="date"><div class="quick"></div></label>` : ''}
      ${a.hasBot ? `<label class="f"><span>Check Eldorado every</span><select name="poll">${[1000, 1500, 2000, 3000, 5000, 10000].map((v) => `<option value="${v}">${v / 1000} s${v === 1000 ? ' (fastest)' : ''}</option>`).join('')}</select><small>Slower = less load on the VPS when you have many customers.</small></label>` : ''}
      <label class="f"><span>Notes (only you see this)</span><textarea name="notes" rows="3" maxlength="500"></textarea></label><div class="formerr"></div>`;
    form.custName.value = a.name; form.notes.value = a.notes || '';
    if (form.paidUntil) {
      form.paidUntil.value = a.paidUntil || '';
      const q = form.querySelector('.quick');
      for (const m of [1, 3, 6, 12]) { const b = el('button', 'btn sm', `+${m} mo`); b.type = 'button'; b.onclick = () => { form.paidUntil.value = addMonthsLocal(form.paidUntil.value, m); drawerState.dirty = true; }; q.append(b); }
    }
    if (form.poll) form.poll.value = String(a.pollIntervalMs || 1000);
    body.append(form); watchDirty(form);
    const save = ibtn('check', 'Save', 'gold', () => form.requestSubmit()); foot.append(save);
    form.onsubmit = async (e) => {
      e.preventDefault();
      const b = { name: form.custName.value, notes: form.notes.value };
      if (form.paidUntil && form.paidUntil.value) b.paidUntil = form.paidUntil.value;
      if (form.poll) b.pollIntervalMs = Number(form.poll.value);
      save.disabled = true;
      const r = await api(`accounts/${a.username}/update`, b);
      save.disabled = false;
      if (!r.ok) { form.querySelector('.formerr').textContent = r.error || 'Failed'; return; }
      drawerState.dirty = false; toast('Saved'); await refresh(); drawerState.tab = 'overview'; renderTab();
    };
  }

  function tabDanger(a, body) {
    const b1 = el('div', 'box');
    b1.append(el('h4', null, a.enabled ? 'Disable customer' : 'Enable customer'), el('p', null, a.enabled ? 'Stops their bot and blocks their login (for example when they did not pay). You can enable them again any time.' : 'Allows their login again and starts their bot.'));
    b1.append(ibtn(a.enabled ? 'pause' : 'play', a.enabled ? 'Disable' : 'Enable', a.enabled ? 'red' : 'green', () => toggleDisable(a)));
    const b2 = el('div', 'box red');
    b2.append(el('h4', null, 'Delete customer'), el('p', null, `Stops the bot and removes the login. Their data folder is kept on the VPS in "deleted". Type ${a.username} to confirm.`));
    const inp = el('input'); inp.placeholder = a.username; inp.autocomplete = 'off'; inp.setAttribute('aria-label', 'Type the username to confirm');
    const wrap = el('div', 'f'); wrap.append(inp);
    const err = el('div', 'formerr');
    const del = ibtn('trash', 'Delete forever', 'red', async () => {
      const r = await api(`accounts/${a.username}/delete`, { confirm: inp.value.trim() });
      if (!r.ok) { err.textContent = r.error || 'Failed'; return; }
      toast(`${a.name} deleted`); closeDrawer(true); refresh();
    });
    del.disabled = true; inp.oninput = () => { del.disabled = inp.value.trim() !== a.username; };
    b2.append(wrap, del, err);
    body.append(b1, b2);
  }

  // ---------- add customer ----------
  function confirmDuplicate(other) {
    return confirmAsk('These API keys are already in use', `"${other}" already uses these keys.\n\nUse them anyway (for testing)? Both bots will see the same requests. If the same category is ON in both, the buyer gets 2 offers from that account. New bots start with every category OFF.`, 'Use anyway');
  }
  function suggestUsername(name) { return name.toLowerCase().normalize('NFKD').replace(/[^a-z0-9]+/g, '').slice(0, 20); }

  function openAdd() {
    drawerState.mode = 'add'; drawerState.dirty = false; drawerState.username = null;
    $('dAv').textContent = '+'; $('dAv').className = 'av admin';
    $('dTitle').textContent = 'Add customer';
    $('dSub').textContent = 'Keys are checked with Eldorado before anything is created';
    $('dTabs').style.display = 'none';
    const body = $('dBody'), foot = $('dFoot'); body.replaceChildren(); foot.replaceChildren(); foot.style.display = '';
    const form = el('form');
    const today = new Date();
    form.innerHTML = `
      <div class="two"><label class="f"><span>Customer name</span><input name="custName" required maxlength="60" placeholder="Ali"></label>
      <label class="f"><span>Username (login)</span><input name="username" required pattern="[a-z0-9][a-z0-9_\\-]{2,31}" placeholder="ali123" autocapitalize="none" spellcheck="false"><small>3-32 lowercase letters, numbers, - or _</small></label></div>
      <label class="f"><span>Eldorado Client ID</span><input name="clientId" required autocomplete="off" spellcheck="false"></label>
      <label class="f"><span>Eldorado Client Secret</span><input name="clientSecret" type="password" required autocomplete="new-password" spellcheck="false"></label>
      <label class="f"><span>Paid until</span><input name="paidUntil" type="date" required><div class="quick"></div></label>
      <label class="f"><span>Notes (optional, only you see this)</span><input name="notes" maxlength="500" placeholder="Paid 10 USD via …"></label>
      <div class="formerr"></div>`;
    form.paidUntil.value = addMonthsLocal('', 1);
    const q = form.querySelector('.quick');
    for (const m of [1, 3, 6, 12]) { const b = el('button', 'btn sm', `${m} month${m > 1 ? 's' : ''}`); b.type = 'button'; b.onclick = () => { form.paidUntil.value = addMonthsLocal('', m); }; q.append(b); }
    let userTouched = false;
    form.username.addEventListener('input', () => { userTouched = true; });
    form.custName.addEventListener('input', () => { if (!userTouched) form.username.value = suggestUsername(form.custName.value); });
    body.append(form); watchDirty(form);
    const create = ibtn('check', 'Check keys & create', 'gold', () => form.requestSubmit());
    foot.append(ibtn('x', 'Cancel', '', () => closeDrawer()), create);
    form.onsubmit = async (e) => {
      e.preventDefault();
      const err = form.querySelector('.formerr'); err.textContent = '';
      create.disabled = true; create.lastChild.textContent = 'Checking keys with Eldorado…';
      const payload = { name: form.custName.value, username: form.username.value.trim().toLowerCase(), clientId: form.clientId.value, clientSecret: form.clientSecret.value, paidUntil: form.paidUntil.value, notes: form.notes.value };
      let r = await api('accounts', payload);
      if (!r.ok && r.duplicateOf && (await confirmDuplicate(r.duplicateOf))) r = await api('accounts', { ...payload, allowDuplicateKeys: true });
      create.disabled = false; create.lastChild.textContent = 'Check keys & create';
      if (!r.ok) { err.textContent = r.error || 'Failed'; return; }
      drawerState.dirty = false;
      toast(`${payload.name} created - bot starting`);
      await refresh();
      openDrawer(r.username, 'login');
    };
    showDrawer();
  }
  $('addBtn').onclick = openAdd;

  // ---------- my account ----------
  $('myAccountBtn').onclick = () => {
    drawerState.mode = 'me'; drawerState.dirty = false;
    $('dAv').textContent = initials(state ? state.me.name : 'A'); $('dAv').className = 'av admin';
    $('dTitle').textContent = 'My account'; $('dSub').textContent = '@' + (state ? state.me.username : 'admin');
    $('dTabs').style.display = 'none';
    const body = $('dBody'), foot = $('dFoot'); body.replaceChildren(); foot.replaceChildren(); foot.style.display = '';
    const form = el('form');
    form.innerHTML = `<div class="box" style="margin-bottom:14px"><h4>Change admin password</h4><p>At least 12 characters. Other devices stay logged in only after they log in again.</p></div>
      <label class="f"><span>Current password</span><input name="current" type="password" required autocomplete="current-password"></label>
      <label class="f"><span>New password</span><input name="next" type="password" required minlength="12" autocomplete="new-password"></label><div class="formerr"></div>`;
    body.append(form); watchDirty(form);
    const save = ibtn('lock', 'Change password', 'gold', () => form.requestSubmit()); foot.append(save);
    form.onsubmit = async (e) => {
      e.preventDefault();
      const r = await api('me/password', { current: form.current.value, next: form.next.value });
      if (!r.ok) { form.querySelector('.formerr').textContent = r.error || 'Failed'; return; }
      drawerState.dirty = false; toast('Password changed'); closeDrawer(true);
    };
    showDrawer();
  };

  // ---------- theme ----------
  function syncTheme() { $('themeBtn').innerHTML = icon(document.documentElement.dataset.theme === 'light' ? 'moon' : 'sun'); }
  $('themeBtn').onclick = () => { const n = document.documentElement.dataset.theme === 'light' ? 'dark' : 'light'; document.documentElement.dataset.theme = n; try { localStorage.setItem('eldo.theme', n); } catch {} syncTheme(); };
  syncTheme();

  $('search').addEventListener('input', render);
  refresh();
  setInterval(() => { if (!$('confirmDlg').open) refresh(); }, 5000);
})();
</script>
</body>
</html>
